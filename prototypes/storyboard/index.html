<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator AI Storyboard App</title>
    <style>
        :root {
            --primary: #111111;
            --primary-hover: #333333;
            --secondary: #f4f4f5;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border: #333333;
            --bg-main: #fafafa;
            --bg-card: #ffffff;
            --radius: 8px;
            --radius-sm: 4px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            color: var(--primary);
        }

        .card {
            background-color: var(--bg-card);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid #e4e4e7;
        }

        label {
            display: block;
            margin-top: 24px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }

        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid #e4e4e7;
            border-radius: var(--radius-sm);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            background-color: var(--bg-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background-color: var(--bg-card);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--primary);
            border: 1px solid #e4e4e7;
        }

        .btn-secondary:hover {
            background-color: #e4e4e7;
        }

        .btn-accent {
            background-color: var(--accent);
        }

        .btn-accent:hover {
            background-color: var(--accent-hover);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 32px;
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e4e4e7;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 80px;
        }
        
        .loader h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .loader p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 32px auto;
            border: 4px solid var(--secondary);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- NEW STORYBOARD LAYOUT STYLES (Based on Reference) --- */
        #storyboardContainer {
            background: #ffffff;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            border: 2px solid #e4e4e7;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .sb-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .sb-title {
            font-size: 28px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin: 0;
            font-family: monospace; /* Gives that drafted/template look */
        }

        .sb-row {
            display: flex;
            margin-bottom: 40px;
            gap: 30px;
        }

        .sb-frame-col {
            flex: 0 0 50%;
            display: flex;
            flex-direction: column;
        }

        .sb-text-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .sb-label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin-bottom: 8px;
            padding-bottom: 4px;
        }

        /* Action and Voiceover get the horizontal line exactly like the reference */
        .text-section .sb-label {
            border-bottom: 1px solid var(--border);
        }

        .sb-text-content {
            font-size: 15px;
            color: var(--text-main);
            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-transform: uppercase; /* To mimic the handwriting style in reference */
        }

        .sb-image-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--border);
            padding: 8px;
            min-height: 250px;
        }

        .sb-image-caption {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🎬 Creator AI Storyboard App</h1>

    <div class="card">
        <div class="sb-input-section">
            <label>API Key (Google AI Studio or OpenRouter):</label>
            <input type="password" id="apiKey" placeholder="AIzaSy... or sk-or-v1-..." style="margin-bottom: 15px;">

            <div class="grid-2">
                <div>
                    <label>Text Generation Model:</label>
                    <select id="textModel">
                        <option value="gemini-3.6-flash">Gemini 3.6 Flash (Studio Model)</option>
                    </select>
                </div>
                <div>
                    <label>Image Generation Model:</label>
                    <select id="imageModel">
                        <option value="google-imagen">Google AI Studio Imagen 3 (Paid, Fast)</option>
                        <option value="pollinations">Pollinations AI (Free, Backup)</option>
                    </select>
                </div>
            </div>

            <h3 class="section-title">Pre Storyboard Inputs</h3>
        
        <div class="grid-2">
            <div>
                <label for="contentGoal">Content Goal</label>
                <select id="contentGoal">
                    <option value="Brand promotion">Brand promotion</option>
                    <option value="Product review">Product review</option>
                    <option value="Educational Reel">Educational Reel</option>
                    <option value="Tutorial">Tutorial</option>
                    <option value="Personal/lifestyle content">Personal/lifestyle content</option>
                    <option value="Trend-based content">Trend-based content</option>
                </select>
            </div>
            <div>
                <label for="targetAudience">Target Audience</label>
                <input type="text" id="targetAudience" placeholder="Who are they? What is their problem/need?">
            </div>
        </div>

        <label for="brief">Brief / Requirements</label>
        <textarea id="brief" placeholder="Paste the creative brief or outline here..."></textarea>

        <label for="script">Script / Idea <small style="color:red;">*</small></label>
        <textarea id="script" placeholder="Write out the script, dialogue, or step-by-step actions..."></textarea>

        <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
            <button onclick="fillSampleData()" class="btn-secondary" style="flex: 1;">Load Sample Data</button>
            <button onclick="generateStoryboard()" class="btn-accent" style="flex: 2;">Generate Storyboard</button>
        </div>
        <div id="tokenUsage" style="margin-top: 15px; font-size: 13px; color: var(--text-muted); text-align: right; display: none;">
            Tokens Used: <span id="tokenCount">0</span>
        </div>
    </div>
    </div>

    <!-- The actual storyboard output -->
    
    <div id="loading" class="loader">
        <h2 style="color: var(--primary); font-family: monospace;">Creating your visual storyline...</h2>
        <p style="color: var(--text-muted);">Turning your script into camera-ready scenes (4-5 frames)</p>
        <div class="spinner"></div>
    </div>

    <div id="storyboardContainer" style="display:none;">
        <div class="sb-header-bar">
            <h2 class="sb-title" id="sbTitle">TITLE: Generated Storyboard</h2>
            <button onclick="regenerateAllImages()" class="btn-secondary" style="width: auto;">🔄 Regenerate All Images</button>
        </div>
        <div id="sbFrames"></div>
        <div style="display: flex; gap: 16px; margin-top: 40px; justify-content: flex-end; border-top: 1px solid #e4e4e7; padding-top: 20px;">
            <button class="btn-secondary" style="width: auto;">Approve Storyboard</button>
            <button class="btn-accent" style="width: auto;">Continue to Video Creation &rarr;</button>
        </div>
    </div>

    <script>
        window.onload = async function() {
            try {
                const response = await fetch('/.env');
                if (response.ok) {
                    const text = await response.text();
                    const lines = text.split('\\n');
                    for (const line of lines) {
                        if (line.startsWith('GOOGLE_API_KEY=')) {
                            const key = line.substring('GOOGLE_API_KEY='.length).trim();
                            if (key && key !== 'YOUR_NEW_API_KEY_HERE') {
                                document.getElementById('apiKey').value = key;
                            }
                        }
                    }
                }
            } catch (e) {
                console.log(".env file not found or could not be loaded via localhost.");
            }
        };

        function fillSampleData() {
            document.getElementById('contentGoal').value = "Product review";
            document.getElementById('targetAudience').value = "Dog owners who struggle with pet hair in their cars.";
            document.getElementById('brief').value = "Hook -> State Problem (hair everywhere) -> Introduce 'Fluff-B-Gone' roller -> Demo on car seat -> Show clean result -> Call to action with discount code.";
            document.getElementById('script').value = "[Creator is sitting in the driver's seat holding a fluffy dog] 'If you have a dog, you know the car hair struggle is real.'\\n[Creator points to passenger seat covered in fur] 'I used to spend 20 minutes vacuuming this...'\\n[Creator whips out the Fluff-B-Gone roller] 'Until I found this magic roller. Watch this!'\\n[Creator swipes it once and the seat is perfectly clean] 'It grabs everything in one pass! Get yours 20% off today at the link below.'";
        }
        async function generateStoryboard() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const textModel = document.getElementById('textModel').value;
            const contentGoal = document.getElementById('contentGoal').value;
            const targetAudience = document.getElementById('targetAudience').value.trim();
            const brief = document.getElementById('brief').value.trim();
            const script = document.getElementById('script').value.trim();
            
            const container = document.getElementById('storyboardContainer');
            const framesContainer = document.getElementById('sbFrames');
            const loading = document.getElementById('loading');
            const inputCard = document.querySelector('.card');
            const tokenUsageDiv = document.getElementById('tokenUsage');
            const tokenCountSpan = document.getElementById('tokenCount');

            if (!apiKey) { alert("Please enter your API Key!"); return; }
            if (!script) { alert("Please enter a Script or Content Idea!"); return; }

            framesContainer.innerHTML = '';
            container.style.display = 'none';
            inputCard.style.display = 'none';
            loading.style.display = 'block';
            tokenUsageDiv.style.display = 'none';

            const benchmarkStyle = "Detailed manga anime comic style line art, ink drawing, thin black lines, pure white background, no shading, clean lineart."; 

            const prompt = `You are a master Content Creator Storyboard Artist.
            I need you to generate exactly 4 frames based on the following inputs:
            - Content Goal: ${contentGoal}
            - Target Audience: ${targetAudience}
            - Requirements/Brief: ${brief}
            - Script/Idea: ${script}

            You MUST output your response as a valid JSON object. Do not include any markdown formatting like \`\`\`json. Only return the raw JSON object.
            The JSON must match this exact structure:
            {
              "frames": [
                {
                  "frame_number": "01",
                  "action": "Brief physical action.",
                  "voiceover": "Exact dialogue.",
                  "image_prompt": "Prompt for the image. ${benchmarkStyle}"
                }
              ]
            }`;

            try {
                let aiText = "";
                let tokensUsed = 0;
                
                // Google AI Studio (Direct)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${textModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error("Google API Error: " + (errData.error ? errData.error.message : response.statusText));
                }
                
                const data = await response.json();
                aiText = data.candidates[0].content.parts[0].text;
                if (data.usageMetadata) tokensUsed = data.usageMetadata.totalTokenCount;
                
                // Clean markdown if the model still returns it
                aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                loading.style.display = 'none';
                container.style.display = 'block';
                inputCard.style.display = 'block'; // Show card again so they see token usage
                
                tokenUsageDiv.style.display = 'block';
                tokenCountSpan.textContent = tokensUsed || "N/A";

                document.getElementById('sbTitle').textContent = `TITLE: ${contentGoal} Storyboard`;
                
                renderStoryboard(aiText, framesContainer);

            } catch (error) {
                loading.style.display = 'none';
                inputCard.style.display = 'block';
                alert(error.message);
            }
        }

        async function fetchImage(promptText, container) {
            const imageModel = document.getElementById('imageModel').value;
            const apiKey = document.getElementById('apiKey').value.trim();

            try {
                const smallText = container.querySelector('.sb-image-caption') ? container.querySelector('.sb-image-caption').outerHTML : `<div class="sb-image-caption">${promptText}</div>`;
                
                container.innerHTML = `<div class="spinner" style="margin-bottom:10px;"></div><p style="font-size:12px; color:var(--text-muted); font-weight:600;">Drawing frame...</p>${smallText}`;

                const finalPrompt = `Detailed black and white comic manga storyboard sketch of this scene: ${promptText}. highly visible dark thin pen ink lines. NO colors. NO shading. white background. cleanly drawn lineart of characters.`;
                
                if (imageModel === 'pollinations') {
                    const encodedPrompt = encodeURIComponent(finalPrompt);
                    const img = new Image();
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.alt = 'Generated Image';
                    
                    const seed = Math.floor(Math.random() * 1000000);
                    img.src = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=500&nologo=true&seed=${seed}`;

                    img.onload = function() {
                        container.innerHTML = '';
                        container.appendChild(img);
                        const caption = document.createElement('div');
                        caption.innerHTML = smallText;
                        container.appendChild(caption);
                    };
                    
                    img.onerror = function() {
                        throw new Error("Failed to load image from Pollinations.");
                    };
                } else if (imageModel === 'google-imagen') {
                    if (!apiKey) throw new Error("Google API Key is required for Imagen.");
                    if (apiKey.startsWith("sk-or-") || apiKey.startsWith("sk-")) throw new Error("You are using an OpenRouter text key! Google Imagen requires a native Google AI Studio API Key starting with AIza...");

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: finalPrompt }] }],
                            generationConfig: {
                                responseModalities: ["IMAGE"]
                            }
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error("Google API Error: " + (err.error ? err.error.message : response.statusText));
                    }

                    const data = await response.json();
                    
                    let base64Data = '';
                    let mimeType = 'image/jpeg';
                    
                    if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                        for (const part of data.candidates[0].content.parts) {
                            if (part.inlineData) {
                                base64Data = part.inlineData.data;
                                mimeType = part.inlineData.mimeType;
                                break;
                            }
                        }
                    }
                    
                    if (!base64Data) {
                        throw new Error("Google API did not return valid image data. Check if your project is whitelisted for image generation.");
                    }
                    
                    container.innerHTML = `<img src="data:${mimeType};base64,${base64Data}" style="width:100%; height:auto; border-radius: var(--radius-sm); border: 1px solid var(--border);" alt="Generated Image">${smallText}`;
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div style="color:#c0392b; font-size:13px; padding:12px; border:1px solid #e74c3c; background:#fadbd8; border-radius:var(--radius-sm); text-align:center;">
                    <b>Image Failed:</b><br>${error.message}
                </div>`;
            }
        }

        window.generateSingleImage = function(frameNum) {
            const container = document.getElementById(`img-container-${frameNum}`);
            const promptText = container.getAttribute('data-prompt');
            fetchImage(promptText, container);
        };

        window.regenerateAllImages = function() {
            const containers = document.querySelectorAll('[id^="img-container-"]');
            containers.forEach(container => {
                const promptText = container.getAttribute('data-prompt');
                fetchImage(promptText, container);
            });
        };

        function renderStoryboard(jsonText, container) {
            try {
                const data = JSON.parse(jsonText);
                const frames = data.frames;
                
                frames.forEach(frame => {
                    const frameNum = frame.frame_number || "00";
                    const actionText = frame.action || "";
                    const voText = frame.voiceover || "";
                    const promptText = frame.image_prompt || "";

                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'sb-row';
                    
                    const frameCol = document.createElement('div');
                    frameCol.className = 'sb-frame-col';
                    frameCol.innerHTML = `
                        <div class="sb-label">FRAME ${frameNum}</div>
                        <div id="img-container-${frameNum}" class="sb-image-box" data-prompt="${promptText.replace(/"/g, '&quot;')}">
                            <button onclick="generateSingleImage('${frameNum}')" class="btn-secondary" style="width: 80%; padding: 12px;">Generate Image</button>
                            <div class="sb-image-caption">${promptText}</div>
                        </div>
                    `;

                    const textCol = document.createElement('div');
                    textCol.className = 'sb-text-col';
                    textCol.innerHTML = `
                        <div class="text-section">
                            <div class="sb-label">ACTION</div>
                            <div class="sb-text-content">${actionText}</div>
                        </div>
                        <div class="text-section">
                            <div class="sb-label">VOICEOVER</div>
                            <div class="sb-text-content">${voText}</div>
                        </div>
                    `;

                    rowDiv.appendChild(frameCol);
                    rowDiv.appendChild(textCol);
                    container.appendChild(rowDiv);
                });
            } catch (e) {
                alert("Failed to parse the storyboard data. Please try generating again.");
                console.error(e);
            }
        }
    </script>
</body>
